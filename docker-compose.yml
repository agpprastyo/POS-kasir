include:
  - docker-compose.infra.yml

services:

  app:
    image: ghcr.io/agpprastyo/pos-kasir:latest
    container_name: pos-kasir
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - pos-network
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
